name: Commonplace

options:
  bundleIdPrefix: com.commonplace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Commonplace:
    type: application
    platform: iOS
    sources:
      - path: Commonplace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commonplace.app
        PRODUCT_NAME: Commonplace
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # iPhone only, portrait only.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Commonplace/Info.plist
      properties:
        CFBundleDisplayName: Commonplace
        CFBundleShortVersionString: "1.0"
        # This palette is warm paper; a dark inversion is a different design.
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf

  # Drives the app to capture the portfolio screenshots in 04 § 7, and doubles
  # as a smoke test that every screen renders.
  CommonplaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CommonplaceUITests
    dependencies:
      - target: Commonplace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commonplace.uitests
        TEST_TARGET_NAME: Commonplace
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
